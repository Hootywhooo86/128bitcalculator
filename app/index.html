<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0b16">
<title>128bitcalculator</title>
<meta name="description" content="A pixel graphing calculator: scientific math, graphing, stats, and conversions for cooking, distance, weight, temperature and more.">
<link rel="manifest" href="manifest.webmanifest">

<style>
  :root{
    --bg:#0b0b16;
    --panel:#141428;
    --line:#2a2a4a;
    --key:#1f1f3a;
    --orange:#ff9f1c;
    --orange-deep:#a05e00;
    --teal:#2dd4bf;
    --blue:#38bdf8;
    --blue-deep:#0369a1;
    --red:#ff5d5d;
    --lcd:#b8c99a;
    --lcd-ink:#1e2a12;
    --lcd-edge:#95a67a;
    --teal-deep:#0e7490;
    --ink:#f4f1ff;
    --muted:#9a97b8;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;overflow-x:hidden}

  .px{font-family:'Press Start 2P',monospace}
  .app{max-width:480px;margin:0 auto;padding:12px 12px 110px;position:relative}
  .tools{display:flex;gap:8px;align-items:center}
  header{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 12px}
  .logo{display:flex;align-items:center;gap:10px;font-family:'Press Start 2P',monospace;font-size:12px}
  .logo i{width:26px;height:26px;background:var(--orange);display:grid;place-items:center;font-style:normal;font-size:13px;box-shadow:0 3px 0 var(--orange-deep)}
  .mode{font-family:'Press Start 2P',monospace;font-size:9px;background:var(--key);color:var(--teal);border:none;padding:8px 10px;box-shadow:0 3px 0 #000;cursor:pointer}
  .tabs{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:3px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:8;padding-bottom:env(safe-area-inset-bottom);padding-left:max(0px,calc(50% - 240px));padding-right:max(0px,calc(50% - 240px))}
  .tabs button{background:none;border:none;padding:10px 0 12px;font-family:'Press Start 2P',monospace;font-size:7px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer}
  .tabs button span{font-size:18px;font-family:system-ui}
  .tabs button.on{color:var(--orange)}
  .tabs button.on span{transform:translateY(-2px)}
  .view{display:none}.view.on{display:block}
  .card{background:var(--panel);border:3px solid var(--line);padding:12px;box-shadow:6px 6px 0 #000;margin-bottom:14px}
  /* ---------- calculator: big display + big pixel keys ---------- */
  #v-calc{--avail:calc(100vh - 132px - var(--sat) - var(--sab));--avail:calc(100dvh - 132px - var(--sat) - var(--sab))}
  #v-calc.on{display:flex;flex-direction:column;gap:10px;min-height:var(--avail)}
  .screen{position:relative;flex:1 1 auto;min-height:120px;background:var(--lcd);color:var(--lcd-ink);border:4px solid var(--bg);box-shadow:inset 0 0 0 3px var(--lcd-edge),6px 6px 0 #000;padding:12px 14px 14px;display:flex;flex-direction:column;justify-content:flex-end;font-family:'Press Start 2P',monospace;overflow:hidden}
  .sbar{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;z-index:2}
  .sbar button{background:none;border:2px solid currentColor;color:var(--lcd-ink);font-family:'Press Start 2P',monospace;font-size:9px;padding:7px 8px;cursor:pointer;opacity:.85}
  .sbar button.on{background:var(--lcd-ink);color:var(--lcd)}
  .sbar .tags{font-size:8px;opacity:.7;display:flex;gap:8px}
  .prevq{font-size:clamp(10px,3vw,14px);text-align:right;opacity:.55;min-height:1.5em;word-break:break-all;margin-top:34px;cursor:pointer}
  .expr{font-size:var(--fs,40px);text-align:right;word-break:break-all;line-height:1.3;max-height:3.95em;overflow-y:auto;scrollbar-width:none}
  .expr .cursor{display:inline-block;width:.14em;height:1em;background:var(--lcd-ink);vertical-align:-.12em;animation:blink 1s steps(1) infinite;margin-left:2px}
  .preview{font-size:clamp(14px,4.4vw,22px);text-align:right;opacity:.6;min-height:1.5em;margin-top:8px;word-break:break-all}
  .preview.err{color:#8a1212;opacity:.9}
  .hist{position:absolute;inset:0;background:var(--lcd);padding:50px 14px 14px;overflow-y:auto;display:none;font-size:12px;line-height:1.6;z-index:1}
  .hist.open{display:block}
  .hist .h{padding:9px 0;border-bottom:2px dashed color-mix(in srgb,var(--lcd-ink) 30%,transparent);cursor:pointer;word-break:break-all}
  .hist .h .a{display:block;text-align:right;font-size:15px}
  .hist .none{opacity:.6;text-align:center;margin-top:24px;line-height:1.8}
  .hist .clr{display:block;margin:14px auto 0;background:none;border:2px solid currentColor;color:var(--lcd-ink);font-family:'Press Start 2P',monospace;font-size:9px;padding:8px 10px;cursor:pointer}
  @keyframes blink{50%{opacity:0}}
  /* stepped "pixel-rounded" corners */
  .pk{--c:8px;clip-path:polygon(0 var(--c),calc(var(--c)/2) var(--c),calc(var(--c)/2) calc(var(--c)/2),var(--c) calc(var(--c)/2),var(--c) 0,calc(100% - var(--c)) 0,calc(100% - var(--c)) calc(var(--c)/2),calc(100% - var(--c)/2) calc(var(--c)/2),calc(100% - var(--c)/2) var(--c),100% var(--c),100% calc(100% - var(--c)),calc(100% - var(--c)/2) calc(100% - var(--c)),calc(100% - var(--c)/2) calc(100% - var(--c)/2),calc(100% - var(--c)) calc(100% - var(--c)/2),calc(100% - var(--c)) 100%,var(--c) 100%,var(--c) calc(100% - var(--c)/2),calc(var(--c)/2) calc(100% - var(--c)/2),calc(var(--c)/2) calc(100% - var(--c)),0 calc(100% - var(--c)))}
  .sci{display:none;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
  #v-calc.sci-on .sci{display:grid}
  .sci button{--c:6px;font-family:'Press Start 2P',monospace;font-size:clamp(9px,2.9vw,13px);height:clamp(34px,calc(var(--avail) * .066),50px);border:none;background:var(--line);color:var(--teal);box-shadow:inset 0 -4px 0 rgba(0,0,0,.3);cursor:pointer;user-select:none;-webkit-user-select:none}
  .sci button.on{background:var(--blue);color:var(--bg)}
  .sci.shift button.alt{color:var(--blue)}
  .pad{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:clamp(44px,calc((var(--avail) * .62 - 28px) / 5),100px);gap:clamp(7px,2vw,11px)}
  #v-calc.sci-on .pad{grid-auto-rows:clamp(40px,calc((var(--avail) * .5 - 28px) / 5),86px)}
  #v-calc.sci-on .prevq{margin-top:30px}
  .pad button{font-family:'Press Start 2P',monospace;font-size:clamp(20px,6.6vw,34px);border:none;background:var(--key);color:var(--ink);box-shadow:inset 0 -7px 0 rgba(0,0,0,.35),inset 0 3px 0 rgba(255,255,255,.07);cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
  .pad button:active,.sci button:active{transform:translateY(3px);filter:brightness(1.18)}
  .pad button.op{background:color-mix(in srgb,var(--teal) 30%,var(--key));color:var(--ink)}
  .pad button.ac{background:var(--blue);color:var(--bg)}
  .pad button.eq{background:var(--orange);color:var(--bg)}
  .pad button.del{font-family:system-ui,sans-serif;font-size:clamp(26px,7.6vw,38px)}
  /* graph */
  .fxrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .fxrow label{font-family:'Press Start 2P',monospace;font-size:9px;width:34px}
  .fxrow input[type=text]{flex:1}
  .fxrow input[type=checkbox]{width:18px;height:18px;accent-color:var(--orange)}
  input,select{background:var(--bg);border:3px solid var(--line);color:var(--ink);font-size:15px;padding:9px 10px;font-family:'Inter',sans-serif;width:100%;border-radius:0}
  input:focus,select:focus{outline:none;border-color:var(--orange)}
  canvas{display:block;width:100%;background:var(--lcd);border:4px solid var(--bg);image-rendering:pixelated;touch-action:none}
  .win{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
  .win label{font-size:10px;color:var(--muted);display:block;margin-bottom:3px;font-family:'Press Start 2P',monospace}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;justify-content:center}
  .btn{font-family:'Press Start 2P',monospace;font-size:9px;padding:11px 12px;background:var(--key);color:var(--ink);border:none;box-shadow:0 4px 0 #000;cursor:pointer}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
  .btn.go{background:var(--orange);color:var(--bg);box-shadow:0 4px 0 var(--orange-deep)}
  .trace{font-family:'Press Start 2P',monospace;font-size:9px;color:var(--teal);margin-top:10px;min-height:14px;line-height:1.6}
  /* convert */
  .cats{display:flex;gap:6px;overflow-x:auto;justify-content:safe center;padding-bottom:8px;margin-bottom:10px;scrollbar-width:none}
  .cats button{flex:0 0 auto;font-family:'Press Start 2P',monospace;font-size:8px;padding:10px;background:var(--key);color:var(--muted);border:3px solid var(--line);cursor:pointer}
  .cats button.on{color:var(--bg);background:var(--teal);border-color:var(--teal-deep)}
  .convgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .convgrid .full{grid-column:span 2}
  .swap{justify-self:center;grid-column:span 2}
  .result{font-family:'Press Start 2P',monospace;font-size:16px;color:var(--orange);text-align:center;padding:16px 4px;word-break:break-all;line-height:1.5}
  .all{list-style:none;font-size:14px;line-height:2}
  .all li{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line)}
  .all li b{color:var(--teal);font-weight:600}
  h3{font-family:'Press Start 2P',monospace;font-size:10px;color:var(--teal);margin-bottom:10px;line-height:1.5;text-align:center}
  .hint{font-size:12px;color:var(--muted);line-height:1.5;margin-top:8px;text-align:center}
  textarea{background:var(--bg);border:3px solid var(--line);color:var(--ink);font-size:14px;padding:10px;width:100%;min-height:120px;font-family:'Inter',sans-serif;resize:vertical}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:14px}
  .stats div{background:var(--bg);padding:8px;border:2px solid var(--line)}
  .stats span{display:block;font-family:'Press Start 2P',monospace;font-size:7px;color:var(--muted);margin-bottom:5px}
  .stats b{color:var(--orange)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--orange);color:var(--bg);font-family:'Press Start 2P',monospace;font-size:10px;padding:12px 16px;box-shadow:0 4px 0 var(--orange-deep);transition:transform .25s;z-index:10}
  .toast.show{transform:translateX(-50%) translateY(0)}
  /* Phones: stay clear of the status bar and the gesture bar. The Android app draws
     edge-to-edge and reports their sizes as --safe-area-inset-*; browsers use env(). */
  :root{--sat:var(--safe-area-inset-top,env(safe-area-inset-top,0px));--sab:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px))}
  .app{padding-top:calc(14px + var(--sat));padding-bottom:calc(110px + var(--sab))}
  .tabs{padding-bottom:var(--sab)}
  body::after{content:"";position:fixed;top:0;left:0;right:0;height:var(--sat);background:var(--bg);z-index:9;pointer-events:none}
  .toast{bottom:calc(96px + var(--sab));transform:translateX(-50%) translateY(calc(240px + var(--sab)))}
  .sheet{padding-bottom:calc(26px + var(--sab))}
</style>
<script src="theme.js" data-app="calc" data-accent="orange" data-second="teal" data-third="blue" data-lcd data-mount="header .tools"></script>
</head>
<body>
<div class="app">
  <header>
    <div class="logo"><i>🧮</i>128BITCALC</div>
    <div class="tools"><button class="mode" id="angleBtn" title="Angle mode">DEG</button></div>
  </header>


  <!-- ============ CALC ============ -->
  <section class="view on" id="v-calc">

      <div class="sbar">

        <button id="sciBtn" title="Scientific keys" aria-label="Scientific keys">SCI ⌄</button>
      </div>
      <div class="hist" id="hist"></div>
      <div class="prevq" id="prevq"></div>
      <div class="expr" id="expr"></div>
      <div class="preview" id="preview"></div>
    </div>
    <div class="sci" id="sci"></div>
    <div class="pad" id="pad"></div>

  <!-- ============ GRAPH ============ -->

        <div><label>YMAX</label><input id="ymax" type="number" value="10"></div>
      </div>
      <div class="btnrow">
        <button class="btn go" id="gDraw">GRAPH</button>
        <button class="btn" id="gStd">ZSTANDARD</button>
        <button class="btn" id="gTrig">ZTRIG</button>
        <button class="btn" id="gIn">ZOOM IN</button>
        <button class="btn" id="gOut">ZOOM OUT</button>
      </div>
    </div>
    <div class="card">
      <h3>TABLE</h3>
      <div class="win" style="grid-template-columns:1fr 1fr;margin-top:0">
        <div><label>TBLSTART</label><input id="tStart" type="number" value="-3"></div>
        <div><label>ΔTBL</label><input id="tStep" type="number" value="1"></div>
      </div>
      <div id="table" style="margin-top:10px;overflow-x:auto"></div>
    </div>
  </section>

  <!-- ============ CONVERT ============ -->

    <div class="card">
      <div class="cats" id="cats"></div>
      <div class="convgrid">
        <div class="full"><input id="cIn" type="text" inputmode="decimal" value="1" aria-label="Amount"></div>
        <div><select id="cFrom" aria-label="From unit"></select></div>
        <div><select id="cTo" aria-label="To unit"></select></div>
        <button class="btn swap" id="cSwap">⇅ SWAP</button>

      <ul class="all" id="cAll"></ul>
      <p class="hint" id="cHint"></p>
    </div>
    <div class="card">
      <h3>🍳 RECIPE SCALER</h3>

        <div><label class="px" style="font-size:8px;color:var(--muted)">SERVES NOW</label><input id="rFrom" type="number" value="4" min="1"></div>
        <div><label class="px" style="font-size:8px;color:var(--muted)">SERVES WANTED</label><input id="rTo" type="number" value="6" min="1"></div>
      </div>
      <textarea id="rIn" style="margin-top:10px" placeholder="One ingredient per line, e.g.&#10;2 cups flour&#10;1 1/2 tsp salt&#10;3/4 cup sugar&#10;2 eggs"></textarea>
      <ul class="all" id="rOut" style="margin-top:10px"></ul>
    </div>
  </section>

  <!-- ============ STAT ============ -->
  <section class="view" id="v-stat">
    <div class="card">
      <h3>L1 — ENTER NUMBERS</h3>
      <textarea id="sIn" placeholder="Separate with commas, spaces or new lines&#10;e.g. 4, 8, 15, 16, 23, 42"></textarea>
      <div class="stats" id="sOut" style="margin-top:10px"></div>
    </div>

      <h3>QUICK MATH</h3>

        <div><label class="px" style="font-size:8px;color:var(--muted)">BILL $</label><input id="tipBill" type="number" value="50"></div>
        <div><label class="px" style="font-size:8px;color:var(--muted)">TIP %</label><input id="tipPct" type="number" value="20"></div>
        <div><label class="px" style="font-size:8px;color:var(--muted)">PEOPLE</label><input id="tipPpl" type="number" value="2" min="1"></div>
        <div><label class="px" style="font-size:8px;color:var(--muted)">PERCENT OF</label><input id="pctOf" type="number" value="15"></div>
      </div>
      <ul class="all" id="tipOut" style="margin-top:10px"></ul>
    </div>
  </section>
</div>
<nav class="tabs">
  <button data-v="calc" class="on"><span>🧮</span>CALC</button>

</nav>

<script>
/* ================= Utilities ================= */
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try { const v = localStorage.getItem('128calc.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem('128calc.' + k, JSON.stringify(v)); } catch {} }
};
let toastTimer;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800); }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmt(n){
  if (typeof n !== 'number' || !isFinite(n)) return isNaN(n) ? 'ERR:DOMAIN' : (n > 0 ? '∞' : '-∞');
  if (n === 0) return '0';
  const a = Math.abs(n);
  if (a >= 1e12 || a < 1e-9) return n.toExponential(8).replace(/\.?0+e/, 'e').replace('e+', 'E').replace('e', 'E');
  return String(parseFloat(n.toPrecision(12)));
}

/* ================= Expression engine ================= */
// Recursive-descent parser: no eval. Supports + - * / ^ ! %, implicit multiplication,
// functions, constants, Ans and variable x.
let angle = store.get('angle', 'DEG');
const toRad = v => angle === 'DEG' ? v * Math.PI / 180 : v;
const fromRad = v => angle === 'DEG' ? v * 180 / Math.PI : v;
function fact(n){
  if (n < 0 || !Number.isInteger(n)) return gamma(n + 1);
  if (n > 170) return Infinity;

}
function gamma(z){ // Lanczos
  if (z < 0.5) return Math.PI / (Math.sin(Math.PI * z) * gamma(1 - z));
  z -= 1; const g = 7, c = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313, -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
  let x = c[0]; for (let i = 1; i < g + 2; i++) x += c[i] / (z + i);
  const t = z + g + 0.5; return Math.sqrt(2 * Math.PI) * Math.pow(t, z + 0.5) * Math.exp(-t) * x;
}
const FUNCS = {
  sin: x => Math.sin(toRad(x)), cos: x => Math.cos(toRad(x)), tan: x => Math.tan(toRad(x)),
  asin: x => fromRad(Math.asin(x)), acos: x => fromRad(Math.acos(x)), atan: x => fromRad(Math.atan(x)),
  sinh: Math.sinh, cosh: Math.cosh, tanh: Math.tanh,
  ln: Math.log, log: Math.log10, sqrt: Math.sqrt, cbrt: Math.cbrt, abs: Math.abs,
  exp: Math.exp, round: Math.round, floor: Math.floor, ceil: Math.ceil, int: Math.trunc,
  ncr: (n, r) => fact(n) / (fact(r) * fact(n - r)), npr: (n, r) => fact(n) / fact(n - r),
  min: Math.min, max: Math.max, logb: (x, b) => Math.log(x) / Math.log(b), root: (x, n) => n % 2 === 1 && x < 0 ? -Math.pow(-x, 1 / n) : Math.pow(x, 1 / n),
  rand: () => Math.random()
};
const CONSTS = { pi: Math.PI, 'π': Math.PI, e: Math.E };

function tokenize(src){
  src = src.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-').replace(/√/g, 'sqrt').replace(/²/g, '^2').replace(/³/g, '^3').replace(/⁻¹/g, '^-1').replace(/ᴇ/g, 'E');
  const toks = []; let i = 0;
  while (i < src.length){
    const c = src[i];
    if (/\s/.test(c)){ i++; continue; }
    if (/[0-9.]/.test(c)){
      let j = i; while (j < src.length && /[0-9.]/.test(src[j])) j++;
      if (src[j] === 'E' && /[-+0-9]/.test(src[j + 1] || '')){ j++; if (/[-+]/.test(src[j])) j++; while (j < src.length && /[0-9]/.test(src[j])) j++; }
      const num = src.slice(i, j);
      if ((num.match(/\./g) || []).length > 1) throw new Error('SYNTAX');
      toks.push({ t: 'num', v: parseFloat(num) }); i = j; continue;
    }
    if (/[a-zA-Zπ]/.test(c)){
      let j = i; while (j < src.length && /[a-zA-Zπ]/.test(src[j])) j++;
      let word = src.slice(i, j).toLowerCase();

  '💾 Data': { base: 'B', units: { 'bit': 0.125, 'byte': 1, 'KB': 1e3, 'MB': 1e6, 'GB': 1e9, 'TB': 1e12, 'KiB': 1024, 'MiB': 1048576, 'GiB': 1073741824 } },
  '⚡ Energy': { base: 'J', units: { 'joule': 1, 'kilojoule': 1000, 'calorie': 4.184, 'kcal (food Cal)': 4184, 'watt-hour': 3600, 'kWh': 3.6e6, 'BTU': 1055.06 } },
  '🌀 Pressure': { base: 'Pa', units: { 'pascal': 1, 'kPa': 1000, 'bar': 1e5, 'psi': 6894.757, 'atm': 101325, 'mmHg': 133.322 } },
  '📐 Angle': { base: 'deg', units: { 'degree': 1, 'radian': 180 / Math.PI, 'gradian': 0.9, 'turn': 360, 'arcminute': 1 / 60, 'arcsecond': 1 / 3600 } }
};
const DEFAULTS = { '🍳 Cooking': ['cup (US)', 'ml'], '🧈 Baking': ['cup', 'gram'], '📏 Distance': ['mile', 'kilometer'], '⚖️ Weight': ['pound', 'kilogram'], '🌡 Temp': ['Fahrenheit', 'Celsius'], '🚗 Speed': ['mph', 'km/h'], '⛽ Fuel': ['mpg (US)', 'L/100km'] };
let cat = store.get('cat', '🍳 Cooking'); if (!UNITS[cat]) cat = '🍳 Cooking';
let ingredient = store.get('ingredient', 'All-purpose flour');
function tempToC(v, u){ return u === 'Celsius' ? v : u === 'Fahrenheit' ? (v - 32) * 5 / 9 : u === 'Kelvin' ? v - 273.15 : 125 + v * 13; }
function cToTemp(c, u){ return u === 'Celsius' ? c : u === 'Fahrenheit' ? c * 9 / 5 + 32 : u === 'Kelvin' ? c + 273.15 : (c - 125) / 13; }
function toBase(v, u, C){
  if (C.temp) return tempToC(v, u);
  const f = C.units[u];
  if (f === 'inv') return 100 / v;
  if (f === 'pace') return 1609.344 / (v * 60);
  if (f === 'pacek') return 1000 / (v * 60);
  if (C.ingredient && typeof f === 'string') return v * C.densities[ingredient] * { cup: 1, tbsp: 1 / 16, tsp: 1 / 48 }[f];
  return v * f;
}
function fromBase(b, u, C){
  if (C.temp) return cToTemp(b, u);
  const f = C.units[u];
  if (f === 'inv') return 100 / b;
  if (f === 'pace') return 1609.344 / (b * 60);
  if (f === 'pacek') return 1000 / (b * 60);
  if (C.ingredient && typeof f === 'string') return b / (C.densities[ingredient] * { cup: 1, tbsp: 1 / 16, tsp: 1 / 48 }[f]);
  return b / f;
}
function parseAmount(s){ // accepts "1 1/2", "3/4", "2.5", or a full expression
  s = String(s).trim(); let m;
  if ((m = s.match(/^(\d+)\s+(\d+)\/(\d+)$/))) return +m[1] + m[2] / m[3];
  try { return parse(s)({ x: 0, ans }); } catch { return NaN; }
}
function nice(n){ if (!isFinite(n)) return '—'; const a = Math.abs(n); return a !== 0 && (a < 0.001 || a >= 1e9) ? n.toExponential(4) : String(parseFloat(n.toPrecision(6))); }
function buildCats(){
  $('cats').innerHTML = Object.keys(UNITS).map(c => `<button data-c="${c}" class="${c === cat ? 'on' : ''}">${c}</button>`).join('');
  $('cats').querySelectorAll('button').forEach(b => b.onclick = () => { cat = b.dataset.c; store.set('cat', cat); buildCats(); buildUnits(); });
}
function buildUnits(){
  const C = UNITS[cat], names = Object.keys(C.units), [d1, d2] = DEFAULTS[cat] || [names[0], names[1]];
  const opt = sel => names.map(n => `<option ${n === sel ? 'selected' : ''}>${n}</option>`).join('');
  $('cFrom').innerHTML = opt(d1); $('cTo').innerHTML = opt(d2);
  let ing = document.getElementById('cIng');
  if (C.ingredient){
    if (!ing){ ing = document.createElement('select'); ing.id = 'cIng'; ing.setAttribute('aria-label', 'Ingredient'); const wrap = document.createElement('div'); wrap.className = 'full'; wrap.appendChild(ing); $('cIn').parentNode.after(wrap); ing.onchange = () => { ingredient = ing.value; store.set('ingredient', ingredient); convert(); }; }
    ing.innerHTML = Object.keys(C.densities).map(n => `<option ${n === ingredient ? 'selected' : ''}>${n}</option>`).join('');
    ing.parentNode.style.display = '';
  } else if (ing) ing.parentNode.style.display = 'none';
  $('cHint').textContent = C.hint || '';
  convert();
}
function convert(){
  const C = UNITS[cat], v = parseAmount($('cIn').value), from = $('cFrom').value, to = $('cTo').value;
  if (!isFinite(v)){ $('cOut').textContent = '—'; $('cAll').innerHTML = ''; return; }
  const b = toBase(v, from, C);
  $('cOut').textContent = `${nice(v)} ${from} = ${nice(fromBase(b, to, C))} ${to}`;
  $('cAll').innerHTML = Object.keys(C.units).filter(u => u !== from).map(u => `<li><span>${u}</span><b>${nice(fromBase(b, u, C))}</b></li>`).join('');
}
$('cIn').addEventListener('input', convert); $('cFrom').onchange = convert; $('cTo').onchange = convert;
$('cSwap').onclick = () => { const a = $('cFrom').value; $('cFrom').value = $('cTo').value; $('cTo').value = a; convert(); };
buildCats(); buildUnits();

// Recipe scaler
const FRAC = [[0, ''], [1 / 8, '⅛'], [1 / 4, '¼'], [1 / 3, '⅓'], [3 / 8, '⅜'], [1 / 2, '½'], [5 / 8, '⅝'], [2 / 3, '⅔'], [3 / 4, '¾'], [7 / 8, '⅞'], [1, '']];
function kitchen(n){
  const whole = Math.floor(n), rest = n - whole;
  let best = FRAC[0]; FRAC.forEach(f => { if (Math.abs(f[0] - rest) < Math.abs(best[0] - rest)) best = f; });
  if (Math.abs(best[0] - rest) > 0.04) return nice(n);
  const w = best[0] === 1 ? whole + 1 : whole;
  return (w ? w + (best[1] ? ' ' : '') : '') + best[1] || '0';
}
function scaleRecipe(){
  const k = (+$('rTo').value || 1) / (+$('rFrom').value || 1);
  store.set('recipe', $('rIn').value);
  $('rOut').innerHTML = $('rIn').value.split('\n').filter(l => l.trim()).map(line => {
    const m = line.trim().match(/^(\d+\s+\d+\/\d+|\d+\/\d+|\d*\.?\d+)\s*(.*)$/);
    if (!m) return `<li><span>${esc(line)}</span><b>—</b></li>`;
    return `<li><span>${esc(m[2])}</span><b>${kitchen(parseAmount(m[1]) * k)}</b></li>`;
  }).join('');
}
$('rIn').value = store.get('recipe', '2 cups flour\n1 1/2 tsp salt\n3/4 cup sugar\n2 eggs');
['rIn','rFrom','rTo'].forEach(id => $(id).addEventListener('input', scaleRecipe)); scaleRecipe();

/* ================= STAT view ================= */
function stats(){
  store.set('list', $('sIn').value);
  const xs = $('sIn').value.split(/[\s,;]+/).filter(Boolean).map(Number).filter(isFinite);
  if (!xs.length){ $('sOut').innerHTML = '<div style="grid-column:span 2;color:var(--muted)">Enter some numbers to see 1-Var Stats.</div>'; return; }
  const n = xs.length, sum = xs.reduce((a, b) => a + b, 0), mean = sum / n, sorted = [...xs].sort((a, b) => a - b);
  const med = a => a.length % 2 ? a[(a.length - 1) / 2] : (a[a.length / 2 - 1] + a[a.length / 2]) / 2;
  const ss = xs.reduce((a, b) => a + (b - mean) ** 2, 0);
  const lower = sorted.slice(0, Math.floor(n / 2)), upper = sorted.slice(Math.ceil(n / 2));
  const counts = {}; xs.forEach(x => counts[x] = (counts[x] || 0) + 1); const top = Math.max(...Object.values(counts));
  const mode = top > 1 ? Object.keys(counts).filter(k => counts[k] === top).join(', ') : 'none';
  const rows = [['x̄ MEAN', mean], ['Σx SUM', sum], ['n', n], ['MED', med(sorted)], ['Sx (SAMPLE)', n > 1 ? Math.sqrt(ss / (n - 1)) : NaN], ['σx (POP)', Math.sqrt(ss / n)], ['MINX', sorted[0]], ['MAXX', sorted[n - 1]], ['Q1', lower.length ? med(lower) : NaN], ['Q3', upper.length ? med(upper) : NaN], ['Σx²', xs.reduce((a, b) => a + b * b, 0)], ['MODE', mode]];
  $('sOut').innerHTML = rows.map(([k, v]) => `<div><span>${k}</span><b>${typeof v === 'number' ? (isNaN(v) ? '—' : fmt(v)) : esc(v)}</b></div>`).join('');
}
$('sIn').value = store.get('list', '4, 8, 15, 16, 23, 42');
$('sIn').addEventListener('input', stats); stats();
function tips(){
  const bill = +$('tipBill').value || 0, pct = +$('tipPct').value || 0, ppl = Math.max(1, +$('tipPpl').value || 1), tip = bill * pct / 100;
  const pctOf = +$('pctOf').value || 0;
  $('tipOut').innerHTML = `<li><span>Tip</span><b>$${tip.toFixed(2)}</b></li><li><span>Total</span><b>$${(bill + tip).toFixed(2)}</b></li><li><span>Each (${ppl})</span><b>$${((bill + tip) / ppl).toFixed(2)}</b></li><li><span>${pctOf}% of $${bill}</span><b>$${(bill * pctOf / 100).toFixed(2)}</b></li><li><span>$${bill} − ${pctOf}% off</span><b>$${(bill * (1 - pctOf / 100)).toFixed(2)}</b></li>`;
}
['tipBill','tipPct','tipPpl','pctOf'].forEach(id => $(id).addEventListener('input', tips)); tips();

/* ================= Tabs ================= */
function show(v){
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  document.querySelectorAll('.view').forEach(s => s.classList.toggle('on', s.id === 'v-' + v));
  store.set('tab', v);
  if (v === 'graph') drawGraph();
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => show(b.dataset.v));
show(store.get('tab', 'calc'));
document.fonts && document.fonts.ready.then(() => { if ($('v-graph').classList.contains('on')) drawGraph(); });
window.addEventListener('themechange', () => { if ($('v-graph').classList.contains('on')) drawGraph(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
